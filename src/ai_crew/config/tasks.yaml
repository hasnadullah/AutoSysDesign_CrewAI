analyst_task:
  description: >
    Analyze the given requirement and:
    - Clarify what is being asked
    - List assumptions
    - Identify risks and ambiguities

    Requirement:
    {input}
  expected_output: >
    Structured analysis with assumptions, risks, and clarified understanding.
  agent: analyst

engineer_task:
  description: >
    Based on analyst output, design a solution:
    - Provide system design
    - List implementation steps
    - Include simple pseudo-code if needed
  expected_output: >
    Clear technical design and implementation plan.
  agent: engineer

reviewer_task:
  description: >
    Review the previous outputs from the Analyst and Engineer.
    Synthesize their findings into a cohesive, conversational response.
    
    Structure your answer in readable paragraphs and bullet points, just like a helpful AI chatbot.
    Explain the assumptions, risks, implementation steps, and open questions naturally. No raw JSON.
  expected_output: >
    A comprehensive, chatbot-style conversational response in rich Markdown formatting.
  agent: reviewer
